name: Release desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (for example v0.1.5)"
        required: true
        default: "v0.1.5"

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y file libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux bundle dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y file libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build platform bundles
        id: tauri
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}
      - name: Stage platform bundles
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          STAGE_DESTINATION: release-stage
        run: node scripts/stage-artifacts.mjs
      - name: Upload platform bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-stage/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List assembled assets
        run: find release-assets -maxdepth 2 -type f -print
      - name: Prepare checksums and release manifest
        run: node scripts/release-manifest.mjs "$RELEASE_TAG" release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Reader Sideload Library ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/**/*
            SHA256SUMS
            latest.json
